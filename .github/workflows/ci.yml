name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (pinned dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt pytest
          pip install --no-deps .
      - name: Unit tests
        run: pytest tests -q
      - name: CLI smoke test
        run: baseline-increment --help

  oldest-python:
    # requirements-lock.txt needs Python >= 3.11; 3.10 is tested with the newest compatible releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - run: pytest tests -q

  action:
    # the composite action in action.yml, run on the shipped synthetic example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          csv: examples/synthetic_ragstyle.csv
          score: detector_score
          label: hallucinated
          group: response_id
          baselines: task_type,generator,log_words

  inspect-native:
    # the native .eval reader must equal inspect_ai's own reader on the shipped fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install . pytest inspect_ai pyarrow
      - run: pytest tests/test_inspect_native.py tests/test_tables.py -q
