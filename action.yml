name: "baseline-increment gate"
description: "Fail the job unless a detector score improves held-out prediction beyond cheap baselines (length, task, model, difficulty): the lower 95% bound of its gain must exceed min-gain."
branding:
  icon: "check-circle"
  color: "blue"
inputs:
  csv:
    description: "Per-item CSV: one row per evaluated item, with the score, the label and the baseline columns"
    required: true
  policy:
    description: "Declared evaluation policy (JSON); when given it fixes score, label, group and baselines, and those inputs must be empty"
    required: false
    default: ""
  evidence-dir:
    description: "Write an evidence package and append to the run ledger here (keep it under version control or upload it)"
    required: false
    default: ""
  score:
    description: "Detector score column (higher = more likely the flagged event); not needed with policy"
    required: false
    default: ""
  label:
    description: "Label column (1 = the event the detector should flag); not needed with policy"
    required: false
    default: ""
  group:
    description: "Group column; items sharing it never straddle train and test folds"
    required: false
    default: ""
  baselines:
    description: "Comma-separated baseline columns; not needed with policy"
    required: false
    default: ""
  min-gain:
    description: "Minimum gain in AUROC the lower 95% bound must exceed (default 0); not used with policy (declare minimum_gain there)"
    required: false
    default: "0"
  extra-args:
    description: "Further CLI arguments, e.g. '--strata task --rank-within model'"
    required: false
    default: ""
  report:
    description: "Optional path for an audit report (.html, printable to PDF, or .md); upload it with actions/upload-artifact"
    required: false
    default: ""
  version:
    description: "PyPI version to install; empty (default) installs the code at the action's own tag"
    required: false
    default: ""
  python-version:
    description: "Python version"
    required: false
    default: "3.12"
outputs:
  report:
    description: "Path of the JSON report"
    value: ${{ steps.run.outputs.report }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install baseline-increment
      shell: bash
      env:
        BI_VERSION: ${{ inputs.version }}
        BI_SRC: ${{ github.action_path }}
      run: |
        if [ -n "$BI_VERSION" ]; then python -m pip install "baseline-increment==${BI_VERSION}"
        else python -m pip install "$BI_SRC"; fi
    - name: Run the gate
      id: run
      shell: bash
      env:
        BI_CSV: ${{ inputs.csv }}
        BI_SCORE: ${{ inputs.score }}
        BI_LABEL: ${{ inputs.label }}
        BI_GROUP: ${{ inputs.group }}
        BI_BASELINES: ${{ inputs.baselines }}
        BI_EXTRA: ${{ inputs.extra-args }}
        BI_REPORT: ${{ inputs.report }}
        BI_POLICY: ${{ inputs.policy }}
        BI_EVIDENCE: ${{ inputs.evidence-dir }}
        BI_MIN_GAIN: ${{ inputs.min-gain }}
      run: |
        report="${RUNNER_TEMP}/baseline-increment-report.json"
        echo "report=${report}" >> "$GITHUB_OUTPUT"
        args=()
        if [ -n "$BI_REPORT" ]; then args+=(--report "$BI_REPORT"); fi
        if [ -n "$BI_EVIDENCE" ]; then args+=(--evidence-dir "$BI_EVIDENCE"); fi
        if [ -n "$BI_POLICY" ]; then
          if [ -n "$BI_SCORE$BI_LABEL$BI_GROUP$BI_BASELINES" ]; then
            echo "::error::with 'policy', leave score, label, group and baselines empty (the policy declares them)"; exit 2
          fi
          # shellcheck disable=SC2086
          baseline-increment "$BI_CSV" --policy "$BI_POLICY" "${args[@]}" --jobs -1 --fail-if-no-increment --json "$report" $BI_EXTRA
        else
          if [ -z "$BI_SCORE" ] || [ -z "$BI_LABEL" ] || [ -z "$BI_BASELINES" ]; then
            echo "::error::give score, label and baselines, or a policy"; exit 2
          fi
          if [ -n "$BI_GROUP" ]; then args+=(--group "$BI_GROUP"); fi
          # shellcheck disable=SC2086
          baseline-increment "$BI_CSV" --score "$BI_SCORE" --label "$BI_LABEL" "${args[@]}" \
            --baselines "$BI_BASELINES" --min-gain "$BI_MIN_GAIN" --jobs -1 --fail-if-no-increment --json "$report" $BI_EXTRA
        fi
