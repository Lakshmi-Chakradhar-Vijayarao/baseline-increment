[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baseline-increment"
version = "0.13.0"
description = "Does a detector's score add anything beyond cheap baselines? Grouped CV, group bootstrap, refit permutation null, within-stratum AUROC."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Lakshmi Chakradhar Vijayarao", email = "vijayaraochakri@gmail.com"}]
dependencies = ["numpy", "pandas", "scipy", "scikit-learn>=1.0", "joblib"]
keywords = ["llm-evaluation", "hallucination-detection", "llm-judge", "guardrails", "incremental-validity",
            "permutation-test", "calibration", "inspect-ai", "lm-evaluation-harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Lakshmi-Chakradhar-Vijayarao/baseline-increment"
Source = "https://github.com/Lakshmi-Chakradhar-Vijayarao/baseline-increment"
Issues = "https://github.com/Lakshmi-Chakradhar-Vijayarao/baseline-increment/issues"
Documentation = "https://github.com/Lakshmi-Chakradhar-Vijayarao/baseline-increment/tree/main/docs/guide"
Changelog = "https://github.com/Lakshmi-Chakradhar-Vijayarao/baseline-increment/blob/main/CHANGELOG.md"
Calibration = "https://github.com/Lakshmi-Chakradhar-Vijayarao/baseline-increment/blob/main/CALIBRATION.md"

[project.optional-dependencies]
fixed-effects = ["statsmodels>=0.13"]
parquet = ["pyarrow>=10"]

[project.scripts]
baseline-increment = "baseline_increment.cli:main"

[tool.setuptools]
packages = ["baseline_increment"]

[tool.setuptools.package-data]
baseline_increment = ["data/*.csv", "data/*.json"]
